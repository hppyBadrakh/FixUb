# Local development database: Postgres + PostGIS, plus Neon's WebSocket proxy so the app can use
# the same `@neondatabase/serverless` driver locally as it does against Neon in production.
#
#   docker compose up -d      start
#   docker compose down -v    stop and delete the data
#
# Matching .env.local values are in .env.example.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: fixub
      POSTGRES_PASSWORD: fixub
      POSTGRES_DB: fixub
    ports:
      # 54329, not 5432, so it never collides with a Postgres installed on the machine.
      - "54329:5432"
    volumes:
      - fixub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixub -d fixub"]
      interval: 2s
      timeout: 3s
      retries: 30

  ws-proxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      # Every WebSocket connection is forwarded to the `db` service above.
      APPEND_PORT: "db:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "54330:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fixub-db:
