# Checks a site's health endpoint and main pages. Run it by hand (Actions → Monitor → Run
# workflow) after a deploy, or against another address by setting the repository variable
# SITE_URL (Settings → Secrets and variables → Actions → Variables).
#
# It is NOT on a schedule: Cloudflare blocks GitHub's servers from reaching ubfix.site (they get
# the "Attention Required" page), so a scheduled run would fail every time although the site is
# up. For round-the-clock monitoring point an uptime service at /api/health instead: see
# "Operations" in the README. To schedule this workflow anyway, first let these requests
# through in Cloudflare, then add:
#
#   schedule:
#     - cron: "7,37 * * * *"
name: Monitor

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  check:
    name: Site is up
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://ubfix.site' }}
    steps:
      - name: Health (the Worker runs and reaches its database)
        run: |
          body=$(curl --silent --show-error --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors "$SITE_URL/api/health")
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::$SITE_URL/api/health does not report ok"; exit 1; }
      - name: Pages and public data answer
        run: |
          for path in / /login /statistics /api/v1/reports /api/v1/categories; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors "$SITE_URL$path")
            echo "$path $code"
            [ "$code" = "200" ] || { echo "::error::$SITE_URL$path answered $code"; exit 1; }
          done
